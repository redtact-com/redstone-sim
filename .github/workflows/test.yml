# 基本 CI (issue #25)
# PR と main/develop への push で vitest (実機 fixture 回帰含む)・typecheck・build を回す。
# 実機 Minecraft は不要 (fixture はコミット済みの期待値で検証する。tools/mc-harness 参照)。

name: Test

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 依存インストール
        run: npm ci

      - name: vitest (単体 + 実機 ground truth fixture)
        run: npx vitest run

      - name: typecheck
        run: npm run typecheck

      - name: build
        run: npm run build

  # E2E スモーク (issue #70)。本番ビルド (vite preview) に対して Playwright を回す。
  # GIF 生成 (npm run demo-gif) はローカル専用で CI には入れない。
  e2e:
    runs-on: ubuntu-latest
    # #203: playwright install が 40 分ハングする事象が複数回あった。
    # timeout が無いと GitHub 既定の 6 時間まで居座るので短く切る
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 依存インストール
        run: npm ci

      # ブラウザをキャッシュしてインストール自体を短縮・安定化する (#203)。
      # キーに playwright のバージョンを含め、上げたら取り直す
      - name: Playwright バージョン取得
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Playwright ブラウザのキャッシュ
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # --with-deps は apt を叩くため遅く、ハングの原因もここだった。
      # ubuntu-latest には必要な共有ライブラリが既に入っているので通常は付けない。
      # 足りない場合に備え、キャッシュミス時だけ deps も入れる
      - name: Playwright chromium インストール
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install chromium
          else
            npx playwright install chromium --with-deps
          fi

      - name: e2e (preview ビルドに対して Playwright)
        run: npm run e2e

      - name: レポート保存 (失敗時)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
